name: AWDF checks

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: npm run test:description && npm run test:scanner
          - os: windows-latest
            command: npm test
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
